# rift config — niri-like scrolling layout.
# Generated by rift-wm-installer. Edit freely; hot-reload is on (save to apply).
# Installed to ~/.config/rift/config.toml by scripts/install-rift.

# ─── Window borders (niri-style; NOT supported by rift) ──────────────────────
# rift v0.6.9 has no window-border setting, so the desired niri `window` colors
# are recorded here only and cannot be applied by rift itself:
#   active-border   = "#2b303cd4"   # RGB 2b303c, alpha d4 (83%)
#   inactive-border = "#2b303cd6"   # RGB 2b303c, alpha d6 (84%)
# Note: active (d4) is intentionally more transparent than inactive (d6).
# To draw real borders, run JankyBorders alongside rift (opt-in — this repo does
# NOT install it):
#   brew tap FelixKratz/formulae && brew install borders
#   # ~/.config/borders/bordersrc:
#   active_color=0xd42b303c
#   inactive_color=0xd62b303c

[settings]
# ─── Global behavior ───
animate = true
animation_duration = 0.2
animation_fps = 100
animation_easing = "ease_out_cubic"

# Focus follows the mouse; keyboard focus warps the cursor back.
focus_follows_mouse = true
mouse_follows_focus = true
mouse_hides_on_focus = false

# Always-on: every new macOS Space is managed with no activation step,
# matching the Paneru config this replaces.
# If a Space ever ends up inactive (e.g. rift briefly ran with the bundled
# config before this file was installed), press Alt+Z to re-activate it.
# If macOS 27 misbehaves with automatic activation, set this to true and
# rely on Alt+Z instead.
default_disable = false

hot_reload = true

# Displays stacked vertically in macOS but physically side-by-side: treat the
# upper display (the physically-left monitor) as logically left, so left/right
# edge crossings enter the neighboring display at the same vertical offset.
horizontal_mouse_warp = "top-to-bottom"

# ─── Layout: niri-like scrolling strip ───
[settings.layout]
mode = "scrolling"
window_insertion_point = "end_of_tree"   # append new windows at the end

[settings.layout.scrolling]
column_width_ratio = 0.85                # focused column fills most of the view
preset_column_widths = [0.3, 0.5, 0.95]   # cycled by Cmd+Alt+W / +Shift+W
min_column_width_ratio = 0.3
max_column_width_ratio = 1.0
preserve_window_sizes = true
expand_single_column = true
alignment = "left"
focus_navigation_style = "anchored"      # honor `alignment`; consistent edge placement

[settings.layout.scrolling.gestures]
enabled = true
fingers = 3
invert_horizontal = false
propagate_to_workspace_swipe = true      # overscroll past the strip switches workspace

# ─── Gaps (matches the old Paneru config: 8px outer + 8px inner) ───
[settings.layout.gaps.outer]
top = 10
left = 10
bottom = 10
right = 10

[settings.layout.gaps.inner]
horizontal = 10
vertical = 10

# ─── Virtual workspaces (rift uses a fixed count; there are no dynamic rows) ───
[virtual_workspaces]
default_workspace_count = 4
workspace_auto_back_and_forth = true

# ─── UI: niri-style overview + menu-bar indicator ───
[settings.ui.mission_control]
enabled = true
show_empty_workspaces = true

[settings.ui.menu_bar]
enabled = true
display_style = "label"
active_label = "index"

# ─── Keybindings (mirrors the lanes in the old config/paneru/init.lua) ───
# Cmd = Meta, Option = Alt, Control = Ctrl.
[keys]
# Space activation — manual lever (rift's bundled default). With
# default_disable = false spaces activate automatically; this recovers a Space
# that got stuck inactive.
"Alt + Z" = "toggle_space_activated"

# Navigation — Cmd+Option+Arrows
"Meta + Alt + Left" = { move_focus = "left" }
"Meta + Alt + Right" = { move_focus = "right" }
"Meta + Alt + Up" = { move_focus = "up" }
"Meta + Alt + Down" = { move_focus = "down" }

# Move window (swap) — Cmd+Option+Shift+Arrows
"Meta + Alt + Shift + Left" = { move_node = "left" }
"Meta + Alt + Shift + Right" = { move_node = "right" }
"Meta + Alt + Shift + Up" = { move_node = "up" }
"Meta + Alt + Shift + Down" = { move_node = "down" }

# Column width — Cmd+Option+W cycles 0.3 / 0.5 / 1.0
"Meta + Alt + W" = "switch_preset_column_width"
"Meta + Alt + Shift + W" = { switch_preset_column_width = { backwards = true } }

# Viewport — center / snap
"Meta + Alt + Space" = "center_selection"
"Meta + Alt + Shift + Space" = "snap_strip"

# Workspaces — Ctrl+Option+Up/Down (rift: fixed count, no dynamic rows)
"Ctrl + Alt + Up" = "prev_workspace"
"Ctrl + Alt + Down" = "next_workspace"
"Ctrl + Alt + Shift + Up" = { move_window_to_workspace = { workspace = "prev", follow = true } }
"Ctrl + Alt + Shift + Down" = { move_window_to_workspace = { workspace = "next", follow = true } }

# Last workspace (closest to Paneru's Cmd+Option+Tab focus-managed)
"Meta + Alt + Tab" = "switch_to_last_workspace"

# Displays — Cmd+Ctrl lane
"Meta + Ctrl + Left" = { focus_display = "left" }
"Meta + Ctrl + Right" = { focus_display = "right" }
"Meta + Ctrl + Shift + Left" = { move_window_to_display = { selector = "left" } }
"Meta + Ctrl + Shift + Right" = { move_window_to_display = { selector = "right" } }
# Send (stay) — rift's move_window_to_display has no follow/send toggle, so send
# maps to the same move as above. Remove these two lines if you don't want that.
"Meta + Ctrl + Alt + Left" = { move_window_to_display = { selector = "left" } }
"Meta + Ctrl + Alt + Right" = { move_window_to_display = { selector = "right" } }
# Warp the mouse to the display above/below (Paneru: Cmd+Ctrl+Up/Down).
"Meta + Ctrl + Up" = { move_mouse_to_display = "up" }
"Meta + Ctrl + Down" = { move_mouse_to_display = "down" }

# Window state — Cmd+Option lane
"Meta + Alt + V" = "toggle_window_floating"
"Meta + Alt + O" = "toggle_stack"
"Meta + Alt + Shift + O" = "unjoin_windows"

# Apps & misc
# Cmd+Ctrl+T opens/activates Ghostty (rift exec runs a command per press; it does
# not spawn a new Ghostty window the way the old Paneru osascript handler did).
"Meta + Ctrl + T" = { exec = ["/usr/bin/open", "-a", "Ghostty"] }
"Meta + Alt + Shift + R" = "reload_config"
"Meta + Alt + Ctrl + Q" = "save_and_exit"

# Dropped vs the old Paneru config (no rift scrolling equivalent):
#   window fullwidth (Cmd+Alt+M)  -> preset cycle above reaches 1.0
#   window balance / equalize / copyrule, fine-grained resize
